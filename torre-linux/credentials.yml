---
controller_credentials:
  - name: "Linux Produccion"
    organization: "Torre-Linux"
    credential_type: "Machine"
    description: "SSH producción — password desde Azure Key Vault"
    inputs:
      username: "ansible-svc"
      become_method: "sudo"
      become_username: "root"

  - name: "Linux Pre-Produccion"
    organization: "Torre-Linux"
    credential_type: "Machine"
    description: "SSH pre-producción — password desde Azure Key Vault"
    inputs:
      username: "ansible-svc-pre"
      become_method: "sudo"
      become_username: "root"

  - name: "Oracle DB Produccion"
    organization: "Torre-Linux"
    credential_type: "Machine"
    description: "Oracle DB — password desde Azure Key Vault"
    inputs:
      username: "ansible-db-svc"

controller_credential_input_sources:
  - target_credential: "Linux Produccion"
    input_field_name: "password"
    source_credential: "Azure Key Vault Source"
    metadata:
      secret_field: "linux-prod-password"
      secret_version: ""

  - target_credential: "Linux Produccion"
    input_field_name: "become_password"
    source_credential: "Azure Key Vault Source"
    metadata:
      secret_field: "linux-prod-password"
      secret_version: ""

  - target_credential: "Linux Pre-Produccion"
    input_field_name: "password"
    source_credential: "Azure Key Vault Source"
    metadata:
      secret_field: "linux-pre-password"
      secret_version: ""

  - target_credential: "Linux Pre-Produccion"
    input_field_name: "become_password"
    source_credential: "Azure Key Vault Source"
    metadata:
      secret_field: "linux-pre-password"
      secret_version: ""

  - target_credential: "Oracle DB Produccion"
    input_field_name: "password"
    source_credential: "Azure Key Vault Source"
    metadata:
      secret_field: "oracle-db-password"
      secret_version: ""
