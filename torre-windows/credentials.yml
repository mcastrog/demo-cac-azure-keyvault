---
controller_credentials:
  - name: "Windows Produccion"
    organization: "Torre-Windows"
    credential_type: "Machine"
    description: "WinRM producción — password desde Azure Key Vault"
    inputs:
      username: "svc-ansible-win@acme.local"

  - name: "Windows Pre-Produccion"
    organization: "Torre-Windows"
    credential_type: "Machine"
    description: "WinRM pre-producción — password desde Azure Key Vault"
    inputs:
      username: "svc-ansible-win-pre@acme.local"

controller_credential_input_sources:
  - target_credential: "Windows Produccion"
    input_field_name: "password"
    source_credential: "Azure Key Vault Source"
    metadata:
      secret_field: "windows-prod-password"
      secret_version: ""

  - target_credential: "Windows Pre-Produccion"
    input_field_name: "password"
    source_credential: "Azure Key Vault Source"
    metadata:
      secret_field: "windows-pre-password"
      secret_version: ""
