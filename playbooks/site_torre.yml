---
- name: "CaC - Aplicar configuración de {{ torre }}"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "../{{ torre }}/credentials.yml"
    - "../{{ torre }}/projects.yml"
    - "../{{ torre }}/inventories.yml"
    - "../{{ torre }}/job_templates.yml"

  vars:
    aap_hostname: "{{ controller_host }}"
    aap_username: "{{ controller_user }}"
    aap_password: "{{ controller_pass }}"
    aap_validate_certs: false

  roles:
    - role: infra.aap_configuration.dispatch
