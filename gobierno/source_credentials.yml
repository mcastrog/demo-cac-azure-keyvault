---
# Conexión de AAP con Azure Key Vault.
#
# Este fichero NO se aplica: ningún playbook lo carga. Documenta la credencial
# que plataforma crea a mano en AAP antes del bootstrap, porque contiene el
# client secret del service principal y ese valor no puede ir en Git.
#
# Todas las credenciales de las torres resuelven sus passwords a través de
# ella. El service principal solo necesita permiso de lectura (get, list)
# sobre los secretos del Key Vault.
controller_credentials:
  - name: "Azure Key Vault Source"
    organization: "Default"
    credential_type: "Microsoft Azure Key Vault"
    inputs:
      url: "https://NOMBRE-KEY-VAULT.vault.azure.net/"
      client: "CLIENT-ID-DEL-SERVICE-PRINCIPAL"
      secret: "SE_INTRODUCE_A_MANO_NO_VA_EN_GIT"
      tenant: "TENANT-ID"
